[project]
name = "audio-quality-analysis-of-encodec"
version = "0.1.0"
description = "Reference-based benchmark of EnCodec reconstruction artifacts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.9",
    "torchaudio>=2.9",
    "torchcodec>=0.9",        # torchaudio 2.9 audio I/O backend
    "transformers>=5.2",      # wrapper_encodec imports HF EncodecModel/AutoProcessor
    "encodec>=0.1.1",
    "auraloss>=0.4.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "tqdm>=4.67",
    "soundfile>=0.13",
    "matplotlib>=3.7",
    "pesq>=0.0.4",
    "pystoi>=0.4",
    "cdpam>=0.0.6",
    "resampy>=0.4",
]
