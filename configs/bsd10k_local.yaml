# Local full BSD10k (in datasets/BSD10K), 44.1 kHz native. Used for analysis
# passes on this machine that need the audio (e.g. the spectral error profile).
# Run from the repo root so the relative paths resolve.

eval:
  device: cpu
  sr: 24000
  bandwidths: [1.5, 3.0, 6.0, 12.0, 24.0]
  output_dir: results/bsd10k

metrics: [lsd, si_snr, mrstft, mel_l1, pesq, stoi]

datasets:
  - name: bsd10k
    mode: manifest
    manifest: datasets/BSD10K/manifest.csv
    audio_root: datasets/BSD10K
    path_col: link               # audio/<sound_id>.wav
    class_col: cls
    limit: null
